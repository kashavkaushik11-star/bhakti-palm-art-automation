name: FLUX 2 Klein 9B Reference Test

on:
  push:
    paths:
      - ".github/workflows/flux2-klein-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install -q pillow requests

      - name: Generate reference edit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import base64, io, os, requests
          from PIL import Image

          ref = Image.open("palm_reference.jpg.jpg").convert("RGB")
          ref.thumbnail((512, 512), Image.Resampling.LANCZOS)
          buf = io.BytesIO()
          ref.save(buf, format="JPEG", quality=95)
          buf.seek(0)

          prompt = """Using the provided real human palm as the reference, preserve the natural hand, five fingers, skin texture, palm creases and realistic anatomy. Create a photorealistic devotional palm-art photograph where a detailed fine black ink drawing of Lord Krishna is genuinely drawn directly on the palm. Krishna should have a recognizable face, flute and peacock feather. The ink must follow the natural palm lines and wrinkles. Keep the real skin visible. Macro photography, realistic skin and lighting, extremely detailed fine pen work. No tattoo, henna, mehndi, sticker, printed image, digital overlay, CGI, watercolor, painted glove, extra fingers, deformed hand, text or watermark."""

          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/ai/run/@cf/black-forest-labs/flux-2-klein-9b"
          files = {"input_image_0": ("palm.jpg", buf.getvalue(), "image/jpeg")}
          data = {
              "prompt": prompt,
              "width": "768",
              "height": "1344",
              "guidance": "3.5",
          }
          r = requests.post(
              url,
              headers={"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"},
              files=files,
              data=data,
              timeout=600,
          )
          print("HTTP:", r.status_code)
          if not r.ok:
              print(r.text[:5000])
              r.raise_for_status()

          obj = r.json()
          image_b64 = obj.get("result", {}).get("image")
          if not image_b64:
              raise RuntimeError("Cloudflare response did not contain result.image: " + str(obj)[:5000])

          out = base64.b64decode(image_b64)
          open("flux2_klein_palm_test.png", "wb").write(out)
          print("Generated:", len(out), "bytes")
          PY

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: flux2-klein-palm-test
          path: flux2_klein_palm_test.png
          retention-days: 3
