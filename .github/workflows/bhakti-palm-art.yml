name: Free.ai SDXL Palm Art TEST

on:
  push:
    branches: [sdxl-free-direct-test]
  workflow_dispatch:
    inputs:
      test_only:
        required: false
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate TEST_ONLY media
        env:
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TEST_ONLY: 'true'
        run: python main.py
      - name: Upload test media
        uses: actions/upload-artifact@v4
        with:
          name: sdxl-free-direct-palm-art-test
          path: |
            work/palm_art.png
            work/wan2_video.mp4
            work/bhakti_reel.mp4
          retention-days: 3
