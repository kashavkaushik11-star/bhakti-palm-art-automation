name: ModelScope Qwen Image Edit Palm Art TEST

on:
  push:
    branches: [modelscope-qwen-edit-2509-test]
  workflow_dispatch:

jobs:
  test-modelscope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ModelScope TEST_ONLY
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TEST_ONLY: 'true'
        run: python main.py
      - name: Upload ModelScope test media
        uses: actions/upload-artifact@v4
        with:
          name: modelscope-qwen-edit-2509-palm-art-test
          path: |
            work/palm_art.png
            work/wan2_video.mp4
            work/bhakti_reel.mp4
          retention-days: 3