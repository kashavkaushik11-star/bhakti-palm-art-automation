name: AI Horde Palm Art TEST

on:
  push:
    branches:
      - ai-horde-palm-test
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Generate test media only; never post'
        required: false
        default: true
        type: boolean

jobs:
  test-ai-horde:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Horde TEST_ONLY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TEST_ONLY: 'true'
        run: python main.py

      - name: Upload AI Horde test media
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-horde-palm-art-test
          path: |
            work/palm_art.png
            work/wan2_video.mp4
            work/bhakti_reel.mp4
          retention-days: 3
