name: OmniGen2 Palm Art TEST

on:
  push:
    branches: [omnigen2-hf-test]
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Generate image/video for checking only (no Facebook/YouTube post)'
        required: false
        default: true
        type: boolean

jobs:
  test-omnigen2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OmniGen2 TEST_ONLY
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TEST_ONLY: 'true'
        run: python main.py

      - name: Upload OmniGen2 test media
        uses: actions/upload-artifact@v4
        with:
          name: omnigen2-palm-art-test
          path: |
            work/palm_art.png
            work/wan2_video.mp4
            work/bhakti_reel.mp4
          retention-days: 3