name: Qwen Image Edit 2511 Palm Art TEST

on:
  push:
    branches: [qwen-edit-2511-free-test]
  workflow_dispatch:
    inputs:
      test_only:
        description: 'TEST ONLY - never post to Facebook or YouTube'
        required: false
        default: true
        type: boolean

jobs:
  generate-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TEST ONLY
        env:
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TEST_ONLY: true
        run: python main.py

      - name: Upload TEST artifact
        if: ${{ always() && github.ref_name == 'qwen-edit-2511-free-test' }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen-image-edit-2511-palm-art-test
          path: |
            work/palm_art.png
            work/wan2_video.mp4
            work/bhakti_reel.mp4
          if-no-files-found: error
          retention-days: 3
