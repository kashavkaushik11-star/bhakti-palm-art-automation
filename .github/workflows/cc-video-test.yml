name: CC Video Test
on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "0 Nature, 1 Wildlife, 2 Science, 3 Space, 4 Travel, 5 Facts"
        required: false
        default: "0"
jobs:
  cc-video-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python -m pip install -U requests "yt-dlp[default]" bgutil-ytdlp-pot-provider
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm ci
          npx tsc
          node build/main.js > /tmp/bgutil.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4416/ >/dev/null 2>&1 && break; sleep 1; done
          cd -
          yt-dlp -v "https://www.youtube.com/watch?v=aqz-KE-bpKQ" 2>&1 | grep -i "PO Token Providers" || true
          cat /tmp/bgutil.log || true
      - name: Start Cobalt downloader
        run: |
          docker network create cobalt-net
          docker run -d --name yt-session-generator --network cobalt-net -p 127.0.0.1:8080:8080 --restart unless-stopped ghcr.io/imputnet/yt-session-generator:webserver

          echo "Waiting for YouTube session generator to create poToken..."
          session_ready=0
          for i in {1..120}; do
            if curl -fsS --max-time 10 http://127.0.0.1:8080/token >/tmp/session.json 2>/dev/null; then
              echo "YouTube session generator ready"
              cat /tmp/session.json
              session_ready=1
              break
            fi
            sleep 3
          done
          if [ "$session_ready" -ne 1 ]; then
            echo "YouTube session generator did not become ready"
            docker logs --tail 120 yt-session-generator || true
            exit 1
          fi

          docker run -d --name cobalt --network cobalt-net -p 9000:9000 -e API_URL="http://127.0.0.1:9000/" -e YOUTUBE_SESSION_SERVER="http://yt-session-generator:8080/" ghcr.io/imputnet/cobalt:11

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/ >/tmp/cobalt-info.json 2>/dev/null; then
              echo "Cobalt ready"
              cat /tmp/cobalt-info.json
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/ >/tmp/cobalt-info.json
          cat /tmp/cobalt-info.json
          docker logs --tail 120 yt-session-generator || true
          docker logs --tail 120 cobalt || true
      - name: Find CC video, download and prepare Reel
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_INDEX: ${{ inputs.topic_index }}
        run: python cc_video_poc_v2.py
      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: cc-video-test
          path: |
            work_cc/cc_reel.mp4
            work_cc/metadata.json
            work_cc/source.mp4
          retention-days: 3
